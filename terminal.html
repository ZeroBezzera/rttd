<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TV Terminal</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    height: 100vh;
    background: #0d1117;
    font-family: 'SF Mono', 'Consolas', monospace;
    color: #c9d1d9;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Tab bar */
  #tabbar {
    display: flex;
    background: #161b22;
    border-bottom: 1px solid #30363d;
    align-items: center;
    padding: 0 6px;
    flex-shrink: 0;
  }
  .tab {
    padding: 8px 16px;
    font-size: 13px;
    color: #8b949e;
    cursor: pointer;
    border-right: 1px solid #30363d;
    white-space: nowrap;
  }
  .tab.active {
    color: #58a6ff;
    background: #0d1117;
    border-bottom: 2px solid #58a6ff;
  }
  #newtab {
    padding: 8px 12px;
    color: #58a6ff;
    cursor: pointer;
    font-size: 16px;
  }
  #filebrowser-toggle {
    margin-left: auto;
    padding: 6px 12px;
    color: #8b949e;
    cursor: pointer;
    font-size: 13px;
    border: 1px solid #30363d;
    border-radius: 4px;
  }
  #filebrowser-toggle.active { color: #58a6ff; border-color: #58a6ff; }

  /* Main area */
  #main {
    flex: 1;
    display: flex;
    overflow: hidden;
  }

  #termarea {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .terminal {
    display: none;
    flex-direction: column;
    flex: 1;
    overflow: hidden;
  }
  .terminal.active { display: flex; }

  .output {
    flex: 1;
    overflow-y: auto;
    padding: 10px 14px;
    font-size: 13px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-all;
  }
  .line-cmd { color: #58a6ff; }
  .line-cmd::before { content: '$ '; color: #3fb950; }
  .line-err { color: #f85149; }
  .line-out { color: #c9d1d9; }

  .inputrow {
    display: flex;
    border-top: 1px solid #30363d;
    padding: 8px 10px;
    background: #161b22;
    flex-shrink: 0;
  }
  .prompt { color: #3fb950; padding-right: 6px; font-size: 14px; }
  .cmdinput {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: #c9d1d9;
    font-family: inherit;
    font-size: 14px;
  }

  /* File browser panel */
  #filebrowser {
    width: 280px;
    border-left: 1px solid #30363d;
    background: #0d1117;
    display: none;
    flex-direction: column;
    overflow: hidden;
    flex-shrink: 0;
  }
  #filebrowser.open { display: flex; }

  #fb-path {
    padding: 8px 10px;
    font-size: 12px;
    color: #8b949e;
    border-bottom: 1px solid #30363d;
    word-break: break-all;
  }
  #fb-list {
    flex: 1;
    overflow-y: auto;
  }
  .fb-item {
    padding: 6px 10px;
    font-size: 13px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .fb-item:hover { background: #161b22; }
  .fb-item.dir { color: #58a6ff; }
  .fb-item.file { color: #c9d1d9; }
  .fb-icon { width: 14px; flex-shrink: 0; }

  #fb-refresh {
    padding: 8px 10px;
    font-size: 12px;
    color: #8b949e;
    cursor: pointer;
    border-top: 1px solid #30363d;
    text-align: center;
  }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; }
</style>
</head>
<body>

  <div id="tabbar">
    <div id="tabs"></div>
    <div id="newtab" onclick="createTab()">+</div>
    <div id="filebrowser-toggle" onclick="toggleFileBrowser()">📁 Files</div>
  </div>

  <div id="main">
    <div id="termarea"></div>

    <div id="filebrowser">
      <div id="fb-path">/</div>
      <div id="fb-list"></div>
      <div id="fb-refresh" onclick="fbLoad(fbCurrentPath)">↻ Refresh</div>
    </div>
  </div>

<script>
  var tabs = [];
  var activeTabId = null;
  var tabCounter = 0;
  var fbCurrentPath = '/';

  function createTab() {
    tabCounter++;
    var id = 'tab-' + tabCounter;
    tabs.push({ id: id, name: 'Term ' + tabCounter, cwd: '/tmp' });

    var tabEl = document.createElement('div');
    tabEl.className = 'tab';
    tabEl.id = id + '-label';
    tabEl.textContent = 'Term ' + tabCounter;
    tabEl.onclick = function() { activateTab(id); };
    document.getElementById('tabs').appendChild(tabEl);

    var termEl = document.createElement('div');
    termEl.className = 'terminal';
    termEl.id = id;
    termEl.innerHTML =
      '<div class="output" id="' + id + '-output"></div>' +
      '<div class="inputrow">' +
        '<span class="prompt">$</span>' +
        '<input class="cmdinput" id="' + id + '-input" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="type a command...">' +
      '</div>';
    document.getElementById('termarea').appendChild(termEl);

    document.getElementById(id + '-input').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        runCommand(id);
      }
    });

    activateTab(id);
  }

  function activateTab(id) {
    activeTabId = id;
    document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
    document.querySelectorAll('.terminal').forEach(function(t) { t.classList.remove('active'); });
    document.getElementById(id + '-label').classList.add('active');
    document.getElementById(id).classList.add('active');
    document.getElementById(id + '-input').focus();
  }

  function appendLine(id, text, cls) {
    var out = document.getElementById(id + '-output');
    var div = document.createElement('div');
    div.className = cls;
    div.textContent = text;
    out.appendChild(div);
    out.scrollTop = out.scrollHeight;
  }

  function runCommand(id) {
    var input = document.getElementById(id + '-input');
    var cmd = input.value;
    if (!cmd.trim()) return;

    appendLine(id, cmd, 'line-cmd');
    input.value = '';

    var tab = tabs.find(function(t) { return t.id === id; });

    fetch('/exec', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ cmd: cmd, cwd: tab.cwd })
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.output) appendLine(id, data.output, 'line-out');
      if (data.error) appendLine(id, data.error, 'line-err');
      if (data.cwd) tab.cwd = data.cwd;
    })
    .catch(function(err) {
      appendLine(id, 'request failed: ' + err, 'line-err');
    });
  }

  function toggleFileBrowser() {
    var fb = document.getElementById('filebrowser');
    var btn = document.getElementById('filebrowser-toggle');
    fb.classList.toggle('open');
    btn.classList.toggle('active');
    if (fb.classList.contains('open')) {
      fbLoad(fbCurrentPath);
    }
  }

  function fbLoad(path) {
    fetch('/ls?path=' + encodeURIComponent(path))
      .then(function(r) { return r.json(); })
      .then(function(data) {
        fbCurrentPath = data.path;
        document.getElementById('fb-path').textContent = data.path;
        var list = document.getElementById('fb-list');
        list.innerHTML = '';

        if (data.path !== '/') {
          var up = document.createElement('div');
          up.className = 'fb-item dir';
          up.innerHTML = '<span class="fb-icon">⬆</span> ..';
          up.onclick = function() {
            var parent = data.path.substring(0, data.path.lastIndexOf('/'));
            fbLoad(parent === '' ? '/' : parent);
          };
          list.appendChild(up);
        }

        data.entries.forEach(function(entry) {
          var item = document.createElement('div');
          item.className = 'fb-item ' + (entry.is_dir ? 'dir' : 'file');
          item.innerHTML = '<span class="fb-icon">' + (entry.is_dir ? '📁' : '📄') + '</span> ' + entry.name;
          item.onclick = function() {
            if (entry.is_dir) {
              fbLoad(data.path.replace(/\/$/, '') + '/' + entry.name);
            } else {
              var tab = tabs.find(function(t) { return t.id === activeTabId; });
              if (tab) {
                var fullpath = data.path.replace(/\/$/, '') + '/' + entry.name;
                document.getElementById(activeTabId + '-input').value = 'cat ' + fullpath;
                document.getElementById(activeTabId + '-input').focus();
              }
            }
          };
          list.appendChild(item);
        });
      })
      .catch(function(err) {
        document.getElementById('fb-list').textContent = 'error: ' + err;
      });
  }

  // Start with one tab
  createTab();
</script>

</body>
</html>
